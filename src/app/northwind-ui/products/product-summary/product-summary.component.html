<section class="summary-page">
  <h2>Categories</h2>
  <!-- Shared, reusable table. T is figured out from [rows] (Category). -->
  <div class="summary-card">
    <app-basic-table [rows]="categories" [columns]="categoryColumns" />
  </div>
</section>
