

@if(isLoading){
  <div class="loading-container">
      <div class="lds-ellipsis"><div></div><div></div><div></div><div></div></div>
  </div>
}

@if(!isChildActive){
  <div id="main-wrapper">
    <article class="product-classification">Product Table</article>
    <div class="product-info-container">
      <mat-table mat-table [dataSource]="dataSource" matSort class="table-mat mat-elevation-z8">

        <ng-container matColumnDef="displayName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Product Name </th>
          <td mat-cell *matCellDef="let element"> {{element.productName}} </td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Quantity </th>
          <td mat-cell *matCellDef="let element"> {{element.quantityPerUnit}} </td>
        </ng-container>


        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Unit Price </th>
          <td mat-cell *matCellDef="let element"> {{element.unitPrice}} </td>
        </ng-container>

        <ng-container matColumnDef="rating">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Rating </th>
          <td mat-cell *matCellDef="let element; let m = index">
            Test
          </td>
        </ng-container>

        <ng-container matColumnDef="discontinued">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Discontinued </th>
          <td mat-cell *matCellDef="let element"> {{element.discontinued}} </td>
        </ng-container>


        <ng-container matColumnDef="edit">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>  </th>
          <!--<td mat-cell *matCellDef="let element">
          <button  class="btn btn-primary" [routerLink]="['details', element.productId]" (click)="AddDialog()">Edit</button></td> -->
          <td mat-cell *matCellDef="let element">
            <span (click)="onSelectProductDetails(element.productId)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
              </svg>
            </span>
            <!-- <button  class="btn btn-primary" (click)="onSelectProductDetails(element.productId)">Edit</button></td> -->
        </ng-container>

        <ng-container matColumnDef="delete">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>  </th>
          <td mat-cell *matCellDef="let element">
              <!-- the click event is on the directive side, not in the templated button-->
            <span (safelinkConfirmed)="deleteProduct(element)" confirmDelete >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>              
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </mat-table>


      <mat-paginator [pageSizeOptions]="[5, 10, 20]"  showFirstLastButtons></mat-paginator>

      <button class="btn btn-success" 
      (click)="onSelectNewProductDetails()">Add New Product</button>

    </div>
    </div>
}


<router-outlet (activate)="isChildActive = true" (deactivate)="isChildActive = false"></router-outlet>
