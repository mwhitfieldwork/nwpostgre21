
@if(isLoggedIn){ 
<app-nav [menuOpen]="mobileNavOpen" (menuToggle)="toggleMobileNav()"></app-nav>
<app-loading-spinner />
<mat-sidenav-container 
class="layout"
autosize> 
  <mat-sidenav #sidenav 
  [mode]="isMobileScreen ? 'over' : 'side'"
  [opened]="!isMobileScreen || mobileNavOpen"
  (closedStart)="mobileNavOpen = false"
  [class.collapsed]="isCollapsed"
  class="sidebar"> 
      <!-- Open/close button for the desktop sidebar -->
      <div class="collapse-btn-container">
        <button type="button" class="collapse-btn" (click)="toggleSidenav()"
          [attr.aria-label]="isCollapsed ? 'Open menu' : 'Close menu'">
          @if (isCollapsed) {
            <span class="collapse-text">open</span>
            <!-- Arrow pointing right: "expand" -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 6 15 12 9 18"></polyline>
            </svg>
          } @else {
            <span class="collapse-text">close</span>
            <!-- Arrow pointing left: "shrink" -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 6 9 12 15 18"></polyline>
            </svg>
          }
        </button>
      </div>
      <mat-nav-list>
  
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <span class="fa fa-dashboard"></span>
          <span class="label">Dashboard</span>
        </a>
  
        <a mat-list-item routerLink="/products" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa fa-archive"></i>
          <span class="label">Product</span>
        </a>

         <a mat-list-item routerLink="/territories" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa fa-archive"></i>
          <span class="label">Territories</span>
        </a> 
        <a mat-list-item routerLink="/admin" routerLinkActive="active" *appDisplayLink>
            <i class="fa fa-shopping-cart"></i>
            <span class="label">Admin Users</span>
        </a>   
        <a mat-list-item href="https://mwhitfieldwork.github.io/portfolio/#home" routerLinkActive="active" *appDisplayLink>
            <i class="fa fa-briefcase"></i>
            <span class="label">Portfolio</span>
        </a>
        <a mat-list-item href="https://grithoodies.com" routerLinkActive="active" *appDisplayLink>
            <i class="fa fa-shopping-cart"></i>
            <span class="label">Shop</span>
        </a>          
      </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container> 
<app-agent-chat />
}@else {
    <router-outlet></router-outlet>
}
