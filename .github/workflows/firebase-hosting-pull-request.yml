name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create environment files
        run: |
          cat <<EOF > src/environments/environment.ts
          export const environment = {
            production: false,
            apiUrl: '${{ secrets.PROD_API_URL }}',
            googleMapsApiKey: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
          };
          EOF
          cat <<EOF > src/environments/environment.prod.ts
          export const environment = {
            production: true,
            apiUrl: '${{ secrets.PROD_API_URL }}',
            googleMapsApiKey: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
          };
          EOF
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # Pinned: firebase-tools 15.34.1 added a service check that fails with 403.
          # 15.34.0 was the last version that deployed. Remove once Firebase fixes it.
          firebaseToolsVersion: '15.34.0'
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NWPOSTGRE21 }}
          projectId: northwind-fe-postgre